name: Build GlassLedger APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 4 -type d 2>/dev/null | head -100
            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

      - name: Check Android SDK
        shell: bash
        run: |
          which sdkmanager
          sdkmanager --version

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract Android project
  shell: bash
  run: |
    rm -rf build_source
    mkdir -p build_source
    unzip -o GlassLedger_v7_FIXED.zip -d build_source
    echo "Project files:"
    find build_source -maxdepth 3 -type f | head -100

       - name: Build GlassLedger APK
    shell: bash
    run: |
    cd build_source/project
    gradle --no-daemon :app:assembleDebug

      - name: Verify APK
  shell: bash
  run: |
    echo "Checking APK..."
    ls -lh build_source/project/app/build/outputs/apk/debug/
    test -f build_source/project/app/build/outputs/apk/debug/app-debug.apk                    
    
        - name: Upload GlassLedger APK
  uses: actions/upload-artifact@v4
    with:
     name: GlassLedger-APK
     path: build_source/project/app/build/outputs/apk/debug/app-debug.apk
     if-no-files-found: error
