name: Build GlassLedger

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build GlassLedger APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Set up Java 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. Set up Android SDK
      # ==========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # 4. Install Android SDK packages
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================
      # 5. Extract GlassLedger ZIP
      # ==========================================
      - name: Extract GlassLedger project
        shell: bash
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          ls -lah

          echo ""
          echo "Checking ZIP file..."

          test -f GlassLedger_v7_FIXED.zip

          echo "ZIP found:"
          ls -lh GlassLedger_v7_FIXED.zip

          echo ""
          echo "Extracting..."

          rm -rf build_source
          mkdir -p build_source

          unzip -o GlassLedger_v7_FIXED.zip -d build_source

          echo ""
          echo "Extracted files:"
          find build_source -maxdepth 4 -type f | head -200

      # ==========================================
      # 6. Find Android project
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=""

          # First preference: directory containing gradlew
          GRADLEW_PATH=$(find build_source -type f -name "gradlew" | head -1 || true)

          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          fi

          # Second preference: directory containing settings.gradle
          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS_PATH=$(find build_source -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1 || true)

            if [ -n "$SETTINGS_PATH" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_PATH")
            fi
          fi

          # Third preference: known structure
          if [ -z "$PROJECT_DIR" ] && [ -d "build_source/project" ]; then
            PROJECT_DIR="build_source/project"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project could not be found."
            echo ""
            echo "Full extracted directory:"
            find build_source -maxdepth 6 -print
            exit 1
          fi

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 7. Show project structure
      # ==========================================
      - name: Check project structure
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -lah "$PROJECT_DIR"

          echo ""
          echo "Gradle files:"
          find "$PROJECT_DIR" -maxdepth 3 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \) \
            -print

      # ==========================================
      # 8. Prepare Gradle
      # ==========================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Using Gradle Wrapper:"
            ./gradlew --version
          else
            echo "Gradle wrapper not found."
            echo "Using system Gradle:"
            gradle --version
          fi

      # ==========================================
      # 9. Build Release APK
      # ==========================================
      - name: Build GlassLedger APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building Release APK..."

          if [ -f "./gradlew" ]; then
            ./gradlew \
              --no-daemon \
              --stacktrace \
              :app:assembleRelease
          else
            gradle \
              --no-daemon \
              --stacktrace \
              :app:assembleRelease
          fi

      # ==========================================
      # 10. Find generated APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1 || true)

          if [ -z "$APK_PATH" ]; then
            echo ""
            echo "ERROR: No APK was generated."
            echo ""
            echo "Build directory:"
            find "$PROJECT_DIR/app/build" -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # ==========================================
      # 11. Verify APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Verifying APK..."

          test -f "$APK_PATH"

          echo ""
          echo "APK successfully created:"
          ls -lh "$APK_PATH"

          echo ""
          echo "APK information:"
          file "$APK_PATH"

      # ==========================================
      # 12. Upload APK
      # ==========================================
      - name: Upload GlassLedger APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassLedger-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
