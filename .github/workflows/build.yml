name: Build GlassLedger APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No GlassLedger ZIP found."
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir project
          unzip -q "$ZIP_FILE" -d project

          PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found."
            find project -maxdepth 3 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build GlassLedger
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Upload GlassLedger APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassLedger-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
